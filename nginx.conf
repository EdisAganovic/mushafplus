# Nginx Configuration for Mushaf Plus
# Save as: /etc/nginx/sites-available/preslusavanje

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain
    
    # Root directory
    root /var/www/preslusavanje;
    index index.html;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript 
               application/x-javascript application/xml+rss
               application/ld+json;
    
    # Cache control for static assets
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
    }
    
    # Images - long cache lifetime
    location ~* \.(png|webp|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip off;
    }
    
    # Quran data file - very long cache lifetime (2.5MB JSON)
    location /data/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_min_length 1000;
        
        # Prevent caching of dynamic content
        if ($request_method = POST) {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # HTML pages - shorter cache with re-validation
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Logs
    access_log /var/log/nginx/preslusavanje.access.log;
    error_log /var/log/nginx/preslusavanje.error.log;
}
